<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Tối ưu Webclip iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Control Center">
    <link rel="apple-touch-icon" href="icon.png"> <!-- Đường dẫn icon của Sếp -->

    <title>Liquid Glass Control</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Load Theme trước để tránh nháy giao diện -->
    <script src="theme.js"></script>
</head>
<body>
    <!-- Khu vực hiển thị Nút bấm -->
    <div class="container" id="control-panel"></div>

    <!-- Nút mở Cài đặt -->
    <button class="settings-toggle" id="open-settings">⚙️</button>

    <!-- Bảng Điều Khiển (Live Knobs) -->
    <div class="settings-modal" id="settings-modal">
        <div class="settings-content">
            <h3>🎨 Tùy chỉnh Giao diện sống</h3>
            
            <div class="setting-group">
                <label>Màu chữ & Symbol</label>
                <input type="color" id="val-color" value="#ffffff">
            </div>

            <div class="setting-group">
                <label>Màu Nền Nút (Kính)</label>
                <input type="color" id="val-bg" value="#ffffff">
                <input type="range" id="val-bg-opacity" min="0" max="100" value="15">
                <small>Độ trong suốt (%)</small>
            </div>

            <div class="setting-group">
                <label>Đổ bóng (Shadow Blur & Spread)</label>
                <input type="range" id="val-shadow-blur" min="0" max="50" value="16">
                <input type="range" id="val-shadow-spread" min="0" max="20" value="0">
            </div>

            <div class="setting-group">
                <label>Bo góc Nút (Border Radius)</label>
                <input type="range" id="val-radius" min="0" max="50" value="25">
            </div>

            <div class="setting-group">
                <label>Kích thước Chữ</label>
                <input type="range" id="val-font-size" min="10" max="24" value="14">
            </div>

            <button class="save-btn" id="close-settings">Lưu & Đóng</button>
        </div>
    </div>

    <!-- Load Logic sau cùng -->
    <script src="main.js"></script>
</body>
</html>
