<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Control Panel">
    <link rel="apple-touch-icon" href="icon.png">
    <title>Trung tâm điều khiển - Sentechtipvn</title>
    <link rel="stylesheet" href="CSS/style.css?v=4.2">
</head>
<body>
    <div class="app-container grid-mode" id="main-container">
        <div class="app-header" data-i18n="app_title">Trung tâm điều khiển</div>
        <div class="grid-layout" id="control-panel"></div>
        <button class="settings-fab" id="open-settings">⚙️</button>
    </div>

    <div class="settings-overlay" id="settings-overlay"></div>

    <div class="settings-drawer" id="settings-drawer">
        <div class="settings-header">
            <h2 data-i18n="settings_title">Cài đặt Giao diện</h2>
            <button id="close-settings">✕</button>
        </div>
        
        <div class="settings-body">
            <div class="config-actions">
                <button id="btn-export" class="action-btn">📤 <span data-i18n="btn_export">Xuất</span></button>
                <button id="btn-import" class="action-btn">📥 <span data-i18n="btn_import">Nhập</span></button>
                <button id="btn-edit-layout" class="action-btn">🔄 <span data-i18n="btn_edit_layout">Sắp xếp</span></button>
            </div>

            <div class="setting-group highlight-box">
                <label data-i18n="lbl_theme_presets">Kho Giao diện (Presets)</label>
                <select id="val-theme-preset">
                    <option value="none" data-i18n="opt_preset_none">Tự do tùy chỉnh</option>
                    <option value="WyIjMzMzMzMzIiwiI2ZmZmZmZiIsImdyaWQiLCIjMWExYTFhIiwiI2ZmZmZmZiIsIiNmZmZmZmYiLCJub25lIiwiNjAiLCIyOCIsIjEwMCIsIjIyIiwiI2NjMDAwMCIsIiNmZmZmMDAiLFsiZ2xvdyIsIjAiLCIwIiwiMTUiLCIwIiwiI2ZmZmYwMCJdXQ" data-i18n="opt_preset_vn">🇻🇳 Cờ Việt Nam</option>
                    <option value="WyIjMGYwZjEzIiwiIzAwZmZmZiIsImdyaWQiLCIjMWExYTFhIiwiIzAwZmZmZiIsIiMwMGZmZmYiLCJub25lIiwiNjAiLCIyOCIsIjEwMCIsIjIwIiwiIzFhMWExYSIsIiMwMGZmZmYiLFsiZ2xvdyIsIjAiLCIwIiwiMjAiLCIyIiwiIzAwZmZmZiJdXQ" data-i18n="opt_preset_neon">🤖 Neon Cyberpunk</option>
                    <option value="WyIjMDAwMDAwIiwiI2ZmZmZmZiIsImdyaWQiLCIjMWExYTFhIiwiI2ZmZmZmZiIsIiNmZmZmZmYiLCJub25lIiwiNjAiLCIyOCIsIjEwMCIsIjIyIiwiIzFjMWMxZSIsIiNmZmZmZmYiLFsib3V0ZXIiLCIwIiwiMCIsIjAiLCIwIiwiIzAwMDAwMCJdXQ" data-i18n="opt_preset_dark">🖤 Dark Minimal</option>
                    <option value="WyIjMTExMTExIiwiI2ZmZDcwMCIsImdyaWQiLCIjMWExYTFhIiwiI2ZmZDcwMCIsIiNmZmQ3MDAiLCJub25lIiwiNjAiLCIzMCIsIjEwMCIsIjUwIiwiIzIyMjIyMiIsIiNmZmQ3MDAiLFsib3V0ZXIiLCIwIiwiNCIsIjEwIiwiMCIsIiMwMDAwMDAiXV0" data-i18n="opt_preset_gold">👑 Gold Sang Trọng</option>
                </select>
                
                <div class="feature-toggles">
                    <label><span data-i18n="lbl_audio_feedback">Âm thanh Haptic</span><input type="checkbox" id="toggle-audio"></label>
                    <label><span data-i18n="lbl_parallax">Gia tốc kế 3D (Parallax)</span><input type="checkbox" id="toggle-parallax"></label>
                </div>
            </div>

            <div class="setting-group highlight-box">
                <label data-i18n="lbl_title_adjust">Chỉnh sửa Tiêu đề chính</label>
                <div class="slider-item">
                    <span class="slider-label" data-i18n="lbl_title_size">Cỡ chữ</span>
                    <input type="range" id="val-title-size" min="14" max="40" value="22">
                </div>
                <div class="slider-item">
                    <span class="slider-label" data-i18n="lbl_title_spacing">Khoảng cách</span>
                    <input type="range" id="val-title-spacing" min="0" max="10" step="0.5" value="0.5">
                </div>
                <label style="margin-top: 10px;"><input type="checkbox" id="toggle-hide-labels"> <span data-i18n="lbl_hide_labels">Ẩn tên Icon ngoài màn hình</span></label>
            </div>

            <div class="setting-group">
                <label data-i18n="lbl_bg_image">Hình nền tự chọn</label>
                <input type="file" id="upload-bg" accept="image/*" style="font-size: 12px;">
                <button type="button" id="clear-bg" style="margin-top:5px; padding:5px; background:rgba(255,255,255,0.1); border:none; color:white; border-radius:5px;">Xóa ảnh nền</button>
            </div>
            <div class="setting-group">
                <label><input type="checkbox" id="toggle-glass"> <span data-i18n="lbl_glassmorphism">Bật Kính mờ (Glassmorphism)</span></label>
            </div>

            <div class="setting-group">
                <label data-i18n="lbl_bg_main">Màu Nền Chính</label>
                <input type="color" id="val-bg-main" value="#121b22">
                <label data-i18n="lbl_text_color">Màu Chữ Hệ Thống</label>
                <input type="color" id="val-text-color" value="#ffffff">
            </div>

            <div class="setting-group">
                <label data-i18n="lbl_layout_mode">Chế độ Danh sách / Lưới</label>
                <div class="layout-buttons">
                    <button id="btn-layout-list" class="layout-btn" data-i18n="btn_list">Danh sách</button>
                    <button id="btn-layout-grid" class="layout-btn active" data-i18n="btn_grid">Lưới</button>
                </div>
            </div>

            <div class="setting-group highlight-box">
                <label>Màu nền List</label><input type="color" id="val-list-bg" value="#1a1a1a">
                <label>Màu chữ List</label><input type="color" id="val-list-text" value="#ffffff">
                <label>Màu SVG List</label><input type="color" id="val-list-svg" value="#ffffff">
                <label style="margin-top: 10px;"><input type="checkbox" id="toggle-list-frame"> <span data-i18n="lbl_list_frame">Bật Khung Theme cho Danh sách</span></label>
            </div>
            
            <div class="setting-group">
                <label data-i18n="lbl_theme_frame">Khung Icon (Theme SVG)</label>
                <select id="val-theme-frame">
                    <option value="none" data-i18n="opt_frame_none">Không khung</option>
                    <option value="Theme/Black-Colour.png" data-i18n="opt_frame_black">Đen bóng</option>
                    <option value="Theme/Red-Colour.png" data-i18n="opt_frame_red">Đỏ ruby</option>
                    <option value="Theme/Green-colour.png" data-i18n="opt_frame_green">Xanh lá</option>
                    <option value="Theme/Orange-colour.png" data-i18n="opt_frame_orange">Cam rực</option>
                    <option value="Theme/Purple-colour.png" data-i18n="opt_frame_purple">Tím dạ</option>
                    <option value="Theme/Moss-green.png" data-i18n="opt_frame_moss">Xanh rêu</option>
                    <option value="custom" data-i18n="opt_frame_custom">SVG Tùy chỉnh</option>
                </select>
                <div id="custom-svg-container" style="display: none;">
                    <textarea id="custom-svg-code" placeholder="Dán mã SVG..." style="width: 100%; height: 80px; margin-top: 10px; border-radius: 8px; padding: 10px; background: rgba(0,0,0,0.3); color: white;"></textarea>
                    <button type="button" id="apply-custom-svg" style="margin-top: 10px; padding: 8px 15px; border-radius: 8px; background: #007aff; color: white; border: none;">Áp dụng SVG</button>
                </div>
            </div>
            
            <div class="setting-group">
                <label data-i18n="lbl_frame_svg_size">Kích thước: Khung Icon & SVG</label>
                <div class="slider-item"><span class="slider-label">Khung</span><input type="range" id="val-frame-size" min="40" max="100" value="60"></div>
                <div class="slider-item"><span class="slider-label" data-i18n="lbl_frame_radius">Bo góc</span><input type="range" id="val-frame-radius" min="0" max="50" value="22"></div>
                <div class="slider-item"><span class="slider-label">SVG</span><input type="range" id="val-svg-size" min="16" max="60" value="28"></div>
                <div class="slider-item"><span class="slider-label" data-i18n="lbl_svg_opacity">Độ đậm</span><input type="range" id="val-svg-opacity" min="0" max="100" value="100"></div>
                <div class="slider-item"><span class="slider-label" data-i18n="lbl_frame_color">Nền khung</span><input type="color" id="val-frame-color" value="#000000"></div>
            </div>
            
            <div class="setting-group"><label data-i18n="lbl_svg_color">Màu SVG</label><input type="color" id="val-svg-color" value="#ffffff"></div>

            <h3 class="section-title" data-i18n="lbl_shadow_section">Chế độ Đổ Bóng</h3>
            <div id="shadow-controls"></div>
        </div>

        <button id="btn-info" class="info-btn">ℹ️</button>
    </div>

    <div class="info-overlay" id="info-overlay"></div>
    <div id="info-modal" class="info-modal macos-window">
        <div class="macos-header">
            <img src="Theme/icon-close.png" class="macos-btn close-btn" id="close-info" alt="Close">
            <img src="Theme/icon-zoom.png" class="macos-btn" alt="Zoom">
            <img src="Theme/icon-full.png" class="macos-btn" alt="Full">
        </div>
        <div class="macos-body">
            <h3 data-i18n="info_title">Control Center</h3>
            <p><span data-i18n="info_dev_prefix">Phát triển bởi</span> <a href="https://browse.shortcuty.app/user/Sentechtipsvn" target="_blank">Sentechtipsvn</a></p>
            <p class="info-desc" data-i18n="info_desc">Webclip điều khiển đa năng, tích hợp giao diện kính mờ và hệ thống Live Knobs tuỳ biến sống động chuyên nghiệp dành riêng cho iOS.</p>
        </div>
    </div>
    
    <script src="js/theme.js?v=4.2"></script>
    <script src="js/main.js?v=4.2"></script>
</body>
</html>
