<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Control Panel">
    <link rel="apple-touch-icon" href="icon.png">
    <title>Trung tâm điều khiển - Sentechtipvn</title>
    <!-- Phải khớp tuyệt đối tên thư mục CSS trên GitHub -->
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <div class="app-container" id="main-container">
        <div class="app-header" data-i18n="app_title">Trung tâm điều khiển</div>
        <div class="grid-layout" id="control-panel"></div>
        <button class="settings-fab" id="open-settings">⚙️</button>
    </div>

    <!-- Nền đen làm mờ -->
    <div class="settings-overlay" id="settings-overlay"></div>

    <div class="settings-drawer" id="settings-drawer">
        <div class="settings-header">
            <h2 data-i18n="settings_title">Cài đặt Giao diện</h2>
            <button id="close-settings">✕</button>
        </div>
        <div class="settings-body">
            
            <div class="setting-group">
                <label data-i18n="lbl_bg_main">Màu Nền Chính</label>
                <input type="color" id="val-bg-main" value="#121b22">
            </div>
            <div class="setting-group">
                <label data-i18n="lbl_text_color">Màu Chữ Hệ Thống</label>
                <input type="color" id="val-text-color" value="#ffffff">
            </div>

            <div class="setting-group">
                <label data-i18n="lbl_layout_mode">Chế độ Danh sách / Lưới</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="layout-toggle">
                    <span class="toggle-slider"></span>
                </div>
            </div>

            <div class="setting-group">
                <label>Màu nền List</label>
                <input type="color" id="val-list-bg" value="#1a1a1a">
                <label>Màu chữ List</label>
                <input type="color" id="val-list-text" value="#ffffff">
                <label>Màu SVG List</label>
                <input type="color" id="val-list-svg" value="#ffffff">
            </div>
            
            <div class="setting-group">
                <label data-i18n="lbl_theme_frame">Khung Icon (Theme SVG)</label>
                <select id="val-theme-frame">
                    <option value="none" data-i18n="opt_frame_none">Không khung</option>
                    <option value="Theme/Black-Colour.png" data-i18n="opt_frame_black">Đen bóng</option>
                    <option value="Theme/Red-Colour.png" data-i18n="opt_frame_red">Đỏ ruby</option>
                    <option value="Theme/Green-colour.png" data-i18n="opt_frame_green">Xanh lá</option>
                    <option value="Theme/Orange-colour.png" data-i18n="opt_frame_orange">Cam rực</option>
                    <option value="Theme/Purple-colour.png" data-i18n="opt_frame_purple">Tím dạ</option>
                    <option value="Theme/Moss-green.png" data-i18n="opt_frame_moss">Xanh rêu</option>
                    <option value="custom" data-i18n="opt_frame_custom">SVG Tùy chỉnh</option>
                </select>
                <div id="custom-svg-container" style="display: none;">
                    <textarea id="custom-svg-code" placeholder="Dán mã SVG của bạn vào đây..." style="width: 100%; height: 80px; margin-top: 10px;"></textarea>
                    <button type="button" id="apply-custom-svg" style="margin-top: 10px; padding: 5px 10px;">Áp dụng SVG</button>
                </div>
            </div>
            
            <div class="setting-group">
                <label data-i18n="lbl_frame_svg_size">Kích thước: Khung Icon & SVG</label>
                <div class="slider-item">
                    <span class="slider-label">Khung</span>
                    <input type="range" id="val-frame-size" min="40" max="100" value="60">
                </div>
                <div class="slider-item">
                    <span class="slider-label" data-i18n="lbl_frame_radius">Bo góc</span>
                    <input type="range" id="val-frame-radius" min="0" max="50" value="22">
                </div>
                <div class="slider-item">
                    <span class="slider-label">SVG</span>
                    <input type="range" id="val-svg-size" min="16" max="60" value="28">
                </div>
                <div class="slider-item">
                    <span class="slider-label" data-i18n="lbl_svg_opacity">Độ đậm</span>
                    <input type="range" id="val-svg-opacity" min="0" max="100" value="100">
                </div>
                <div class="slider-item">
                    <span class="slider-label" data-i18n="lbl_frame_color">Nền khung</span>
                    <input type="color" id="val-frame-color" value="#000000">
                </div>
            </div>
            
            <div class="setting-group">
                <label data-i18n="lbl_svg_color">Màu SVG</label>
                <input type="color" id="val-svg-color" value="#ffffff">
            </div>

            <h3 class="section-title" data-i18n="lbl_shadow_section">Chế độ Đổ Bóng</h3>
            <div id="shadow-controls"></div>
        </div>
    </div>
    
    <script src="js/theme.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
