<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Control Panel">
    <link rel="apple-touch-icon" href="icon.png">
    <title>Webclip Control</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <div class="app-container">
        <div class="grid-layout" id="control-panel"></div>
        <!-- Bỏ text mặc định trong nút, JS sẽ tự chèn SVG vào -->
        <button class="settings-fab" id="open-settings"></button>
    </div>

    <div class="settings-drawer" id="settings-drawer">
        <div class="settings-header">
            <h2 data-i18n="settings_title"></h2>
            <button id="close-settings">✕</button>
        </div>
        <div class="settings-body">
            <div class="setting-group">
                <label data-i18n="lbl_bg_main"></label>
                <input type="color" id="val-bg-main" value="#121b22">
            </div>
            <div class="setting-group">
                <label data-i18n="lbl_text_color"></label>
                <input type="color" id="val-text-color" value="#ffffff">
            </div>
            
            <div class="setting-group">
                <label data-i18n="lbl_theme_frame"></label>
                <select id="val-theme-frame">
                    <option value="none" data-i18n="opt_frame_none"></option>
                    <option value="url('Theme/Black-Colour.png')" data-i18n="opt_frame_black"></option>
                    <option value="url('Theme/Red-Colour.png')" data-i18n="opt_frame_red"></option>
                    <option value="url('Theme/Green-colour.png')" data-i18n="opt_frame_green"></option>
                    <option value="url('Theme/Orange-colour.png')" data-i18n="opt_frame_orange"></option>
                    <option value="url('Theme/Purple-colour.png')" data-i18n="opt_frame_purple"></option>
                    <option value="url('Theme/Moss-green.png')" data-i18n="opt_frame_moss"></option>
                </select>
            </div>
            
            <div class="setting-group">
                <label data-i18n="lbl_frame_svg_size"></label>
                <div class="slider-item">
                    <span class="slider-label">Khung</span>
                    <input type="range" id="val-frame-size" min="40" max="100" value="60">
                </div>
                <div class="slider-item">
                    <span class="slider-label">SVG</span>
                    <input type="range" id="val-svg-size" min="16" max="60" value="28">
                </div>
            </div>
            
            <div class="setting-group">
                <label data-i18n="lbl_svg_color"></label>
                <input type="color" id="val-svg-color" value="#ffffff">
            </div>

            <h3 class="section-title" data-i18n="lbl_shadow_section"></h3>
            <div id="shadow-controls"></div>
        </div>
    </div>
    
    <script src="js/theme.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
